[project]
name = "ospro"
version = "0.1.2"
description = "Better than decent, open source espresso."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "customtkinter>=5.2.2",
    "pillow>=10.4",
    "pytz>=2024.1",
    "pytensils>=1.4.0",
]

[project.optional-dependencies]
rpi = [
    "RPi.GPIO>=0.7.1",
    "adafruit-circuitpython-ads1x15>=3.0.5",
    "adafruit-circuitpython-max31855>=3.3.0",
]

[tool.uv]
package = false
